# /etc/nginx/sites-available/msmoveissobmedida.com.br
# Proxy reverso do Nginx para o Next.js (rodando via PM2 na porta 3000).
# Depois de instalar este arquivo, rode `sudo certbot --nginx -d msmoveissobmedida.com.br -d www.msmoveissobmedida.com.br`
# para o Certbot adicionar automaticamente os blocos de HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name msmoveissobmedida.com.br www.msmoveissobmedida.com.br;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets estáticos do Next.js (hash no nome do arquivo = cache longo e seguro)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
