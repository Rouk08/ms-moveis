# /etc/nginx/conf.d/msmoveissobmedida.com.br.conf
#
# ATENÇÃO: este arquivo já inclui os blocos de SSL adicionados
# automaticamente pelo Certbot (marcados "managed by Certbot"). Se este
# arquivo for reinstalado do zero num servidor novo (sem certificado
# ainda), rode `sudo certbot --nginx -d msmoveissobmedida.com.br -d
# www.msmoveissobmedida.com.br` depois de copiá-lo — o Certbot edita o
# arquivo automaticamente para adicionar os blocos de HTTPS.
#
# NUNCA sobrescreva o arquivo em produção com uma versão sem os blocos
# managed by Certbot (isso derruba o HTTPS). Para alterar algo fora
# desses blocos, edite este arquivo, copie para a VPS e rode
# `sudo nginx -t && sudo systemctl reload nginx` — não rode o certbot de
# novo à toa.

server {
    server_name msmoveissobmedida.com.br www.msmoveissobmedida.com.br;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets estáticos do Next.js. NÃO usar Cache-Control "immutable" de
    # longa duração aqui: com Turbopack (ainda experimental) o mesmo nome
    # de chunk pode ser reaproveitado entre builds mesmo com conteúdo
    # diferente, e um cache "immutable" faria o navegador servir JS
    # desatualizado indefinidamente. Deixa o Next.js (proxy_pass) definir
    # o Cache-Control.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/msmoveissobmedida.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/msmoveissobmedida.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.msmoveissobmedida.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = msmoveissobmedida.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name msmoveissobmedida.com.br www.msmoveissobmedida.com.br;
    return 404; # managed by Certbot
}
